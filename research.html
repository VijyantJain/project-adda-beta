<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adda Research</title><style>body{font-family:system-ui;margin:0;background:#f5f3ef;color:#111}.w{max-width:900px;margin:auto;padding:24px}input,button{font:inherit;padding:12px;border-radius:12px;border:1px solid #ddd}button{background:#6d4aff;color:#fff;border:0;font-weight:800}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:18px 0}.c{background:#fff;border:1px solid #e6e0d8;border-radius:16px;padding:14px}.n{font-size:28px;font-weight:900}table{width:100%;border-collapse:collapse;background:#fff;border-radius:16px;overflow:hidden}td,th{padding:10px;border-bottom:1px solid #eee;text-align:left;font-size:13px}.muted{color:#777}.row{display:flex;gap:8px;flex-wrap:wrap}</style></head><body><div class="w"><h1>Adda Research Console</h1><p class="muted">Functional Beta V0.3 · enter Crew ID and research key.</p><div class="row"><input id="crew" placeholder="Crew ID e.g. c_..." style="flex:1"><input id="key" type="password" placeholder="Research key" style="flex:1"><button onclick="load()">Load</button></div><div id="out"></div></div><script>async function load(){const crew=document.getElementById('crew').value.trim(),key=document.getElementById('key').value;const o=document.getElementById('out');o.innerHTML='Loading…';try{const r=await fetch('/api?action=stats&crewId='+encodeURIComponent(crew),{headers:{'x-research-key':key}});const j=await r.json();if(!r.ok)throw Error(j.error||'Error');const ec=j.eventCounts||{};o.innerHTML=`<div class="grid"><div class="c"><div class="n">${j.members.length}</div><div>Members</div></div><div class="c"><div class="n">${j.drops.length}</div><div>Drops created</div></div><div class="c"><div class="n">${ec.response_submitted||0}</div><div>Answers</div></div><div class="c"><div class="n">${j.chats}</div><div>Chat messages</div></div></div><h2>${j.crew.name}</h2><table><tr><th>Drop</th><th>Type</th><th>Answers</th></tr>${j.drops.map(d=>`<tr><td>${e(d.question)}</td><td>${e(d.type)}</td><td>${d.responseCount}</td></tr>`).join('')}</table><h2>Events</h2><table>${Object.entries(ec).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${e(k)}</td><td>${v}</td></tr>`).join('')}</table>`}catch(err){o.innerHTML='<p style="color:#a22">'+e(err.message)+'</p>'}}function e(s){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}</script></body></html>
